name: Round43 World Static Repair
on:
  push:
    branches:
      - codex/round43-378-379
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[round43-world-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/round43-378-379
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m pip install beautifulsoup4
      - run: python tools/round43_world_fix.py
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "43周目 world静的表示を整合 [round43-world-fix]"
          git push origin HEAD:codex/round43-378-379
